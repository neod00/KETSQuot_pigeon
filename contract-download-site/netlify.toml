[build]
  base = "contract-download-site"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = [
    "netlify/functions/assets/*-master.pdf",
    "netlify/functions/assets/placements.json",
    "netlify/functions/assets/NanumGothic-Regular.ttf",
    "netlify/functions/assets/NanumGothic-Bold.ttf"
  ]

[functions.issue]
  timeout = 30

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"
    Content-Security-Policy = "default-src 'none'; frame-ancestors 'none'; base-uri 'none'"
