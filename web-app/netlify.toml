[build]
  command = "npm run build"
  publish = ".next"

[functions]
  directory = "netlify/functions"
  included_files = ["templates/ADJ_v3.xlsx"]

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/outlook/sam-outlook.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Content-Disposition = 'attachment; filename="sam-outlook.xml"'
